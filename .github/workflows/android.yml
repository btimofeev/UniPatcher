name: Android

on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'Android ABIs (comma separated)'
        required: false
        default: 'arm64-v8a,armeabi-v7a,x86_64'
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build free debug APK
    runs-on: ubuntu-latest

    env:
      ABIS: ${{ inputs.abis || 'arm64-v8a,armeabi-v7a,x86_64' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install NDK, CMake and platform
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager() {
            local cmd="$(command -v sdkmanager || true)"
            if [ -n "$cmd" ]; then
              "$cmd" "$@"
            else
              "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" "$@"
            fi
          }
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
                     "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Cache native dependencies
        id: cache-native
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/cpp/xdelta3/xdelta
            app/src/main/cpp/xz/xz
          key: native-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}

      - name: Download native dependencies
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: ./gradlew --no-daemon --build-cache downloadDependencies

      - name: Run unit tests
        run: ./gradlew --no-daemon --build-cache :app:testFreeDebugUnitTest

      - name: Build
        run: ./gradlew --no-daemon --build-cache :app:assembleFreeDebug -PabiFilters="$ABIS"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: unipatcher-free-debug-apk
          path: app/build/outputs/apk/free/debug/*.apk
          if-no-files-found: error